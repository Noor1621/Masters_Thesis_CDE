<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi-Year Snow Variability Tool — Hohe Tauern Snow Thesis</title>
<meta name="description" content="Interactive 2018–2025 comparison of snow classification and land surface temperature maps for Hohe Tauern National Park.">
<style>
  :root{--bg:#0a1929;--panel:rgba(15,32,53,.55);--line:rgba(148,197,230,.25);--ice:#dff1ff;--glow:#7fd4ff;--muted:#a9c3d8}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ice);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
  a{color:var(--glow)}
  .wrap{max-width:1000px;margin:0 auto;padding:32px 20px 80px}
  .tool{border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:22px}
  .eyebrow{font-size:10px;letter-spacing:.35em;text-transform:uppercase;color:var(--glow);margin:0}
  h1{font-size:28px;margin:10px 0 6px;font-weight:600}
  .cap{font-size:14px;color:var(--muted);margin:0}
  .row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;margin-top:22px}
  label{display:flex;flex-direction:column;gap:6px;font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:var(--muted)}
  select{border:1px solid var(--line);background:rgba(255,255,255,.1);color:#fff;border-radius:8px;padding:8px 10px;font-size:14px;letter-spacing:normal;text-transform:none}
  select option{color:#0a1929}
  button{border:1px solid var(--line);background:transparent;color:var(--ice);border-radius:999px;padding:8px 16px;font-size:10px;letter-spacing:.25em;text-transform:uppercase;cursor:pointer}
  button:hover{background:rgba(255,255,255,.1)}
  .cmp{position:relative;width:100%;margin-top:22px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;aspect-ratio:16/10;cursor:ew-resize;touch-action:none;user-select:none;-webkit-user-select:none}
  .cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;-webkit-user-drag:none}
  .clip{position:absolute;inset:0;overflow:hidden;width:50%}
  .clip img{width:200%;max-width:none}
  .handle{position:absolute;top:0;bottom:0;left:50%;width:2px;background:#fff;box-shadow:0 0 10px rgba(0,0,0,.5);transform:translateX(-1px)}
  .knob{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:999px;background:#fff;color:#0a1929;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
  .tag{position:absolute;top:10px;padding:4px 10px;border-radius:999px;background:rgba(10,25,41,.75);font-size:11px;letter-spacing:.1em}
  .tag.l{left:10px}.tag.r{right:10px}
  .thumbs{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-top:16px}
  .thumbs button{padding:8px 0;font-size:11px;letter-spacing:.05em}
  .thumbs button[aria-pressed="true"]{background:var(--glow);color:#0a1929;border-color:var(--glow)}
  @media(max-width:640px){.thumbs{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <p><a href="index.html">&larr; Back to thesis home</a></p>
  <section class="tool" data-yeartool>
    <p class="eyebrow">&#10052; Interactive Time Series</p>
    <h1>Multi-Year Snow Variability Tool</h1>
    <p class="cap" data-yeartool-caption></p>

    <div class="row">
      <label>Dataset
        <select data-yeartool-dataset></select>
      </label>
      <label>Left year
        <select data-yeartool-left></select>
      </label>
      <label>Right year
        <select data-yeartool-right></select>
      </label>
      <button type="button" data-yeartool-swap>&#8646; Swap</button>
    </div>

    <div class="cmp" data-compare-root>
      <img data-compare-after alt="Right year map">
      <div class="clip" data-compare-clip>
        <img data-compare-before alt="Left year map">
      </div>
      <span class="tag l" data-compare-before-label></span>
      <span class="tag r" data-compare-after-label></span>
      <div class="handle" data-compare-handle><span class="knob">&#8646;</span></div>
    </div>

    <div class="thumbs" data-yeartool-thumbs></div>
  </section>
</div>

<script>
(function () {
  var YEARS = [2018,2019,2020,2021,2022,2023,2024,2025];
  var DATASETS = {
    depletion: { label: "LST — Depletion Season", dir: "pics/", prefix: "lst_deple_", ext: ".png",
      caption: "Mean Land Surface Temperature (°C) during the depletion season across Hohe Tauern National Park." },
    accumulation: { label: "LST — Accumulation Season", dir: "pics/", prefix: "lst_accum_", ext: ".png",
      caption: "Mean Land Surface Temperature (°C) during the accumulation season across Hohe Tauern National Park." },
    snow_accum: { label: "Snow Classification — Accumulation Season", dir: "pics/", prefix: "snow_accum_", ext: ".jpg",
      caption: "Dry snow, wet snow and non-snow classification during the accumulation season across Hohe Tauern National Park." },
    snow_deple: { label: "Snow Classification — Depletion Season", dir: "pics/", prefix: "snow_deple_", ext: ".jpg",
      caption: "Dry snow, wet snow and non-snow classification during the depletion season across Hohe Tauern National Park." }
  };
  function src(key, year){ var d = DATASETS[key]; return d.dir + d.prefix + year + d.ext; }

  var state = { ds: "depletion", left: 2018, right: 2025, pos: 50, active: "left" };

  var dsSel   = document.querySelector('[data-yeartool-dataset]');
  var leftSel = document.querySelector('[data-yeartool-left]');
  var rightSel= document.querySelector('[data-yeartool-right]');
  var swap    = document.querySelector('[data-yeartool-swap]');
  var capEl   = document.querySelector('[data-yeartool-caption]');
  var thumbs  = document.querySelector('[data-yeartool-thumbs]');
  var cmp     = document.querySelector('[data-compare-root]');
  var beforeI = document.querySelector('[data-compare-before]');
  var afterI  = document.querySelector('[data-compare-after]');
  var clip    = document.querySelector('[data-compare-clip]');
  var handle  = document.querySelector('[data-compare-handle]');
  var blab    = document.querySelector('[data-compare-before-label]');
  var alab    = document.querySelector('[data-compare-after-label]');
  if (!cmp) return;

  Object.keys(DATASETS).forEach(function (k) {
    dsSel.add(new Option(DATASETS[k].label, k));
  });
  YEARS.forEach(function (y) {
    leftSel.add(new Option(y, y));
    rightSel.add(new Option(y, y));
    var b = document.createElement('button');
    b.type = 'button'; b.textContent = y; b.dataset.year = y;
    b.addEventListener('click', function () {
      state[state.active] = +y;
      state.active = state.active === 'left' ? 'right' : 'left';
      render();
    });
    thumbs.appendChild(b);
  });

  function setPos(p) {
    if (isNaN(p)) return;
    state.pos = Math.max(0.5, Math.min(99.5, p));
    clip.style.width = state.pos + '%';
    beforeI.style.width = (100 / state.pos) * 100 + '%';
    handle.style.left = state.pos + '%';
    handle.setAttribute('aria-valuenow', Math.round(state.pos));
  }
  function fromX(x) {
    var r = cmp.getBoundingClientRect();
    if (r.width) setPos(((x - r.left) / r.width) * 100);
  }
  function render() {
    var d = DATASETS[state.ds];
    dsSel.value = state.ds;
    leftSel.value = state.left;
    rightSel.value = state.right;
    beforeI.src = src(state.ds, state.left);
    afterI.src  = src(state.ds, state.right);
    beforeI.alt = d.label + ' ' + state.left;
    afterI.alt  = d.label + ' ' + state.right;
    blab.textContent = state.left;
    alab.textContent = state.right;
    capEl.textContent = d.caption + ' Drag the slider to compare any two years from 2018–2025.';
    Array.prototype.forEach.call(thumbs.children, function (b) {
      var y = +b.dataset.year;
      b.setAttribute('aria-pressed', (y === state.left || y === state.right) ? 'true' : 'false');
    });
    setPos(state.pos);
  }

  dsSel.addEventListener('change', function () { state.ds = dsSel.value; render(); });
  leftSel.addEventListener('change', function () { state.left = +leftSel.value; render(); });
  rightSel.addEventListener('change', function () { state.right = +rightSel.value; render(); });
  swap.addEventListener('click', function () { var l = state.left; state.left = state.right; state.right = l; render(); });

  var dragging = false;
  function down(e) { dragging = true; cmp.setPointerCapture && e.pointerId != null && cmp.setPointerCapture(e.pointerId); fromX(e.clientX != null ? e.clientX : e.touches[0].clientX); e.preventDefault(); }
  function move(e) { if (!dragging) return; fromX(e.clientX != null ? e.clientX : e.touches[0].clientX); e.preventDefault(); }
  function up() { dragging = false; }

  if (window.PointerEvent) {
    cmp.addEventListener('pointerdown', down);
    cmp.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  } else {
    cmp.addEventListener('mousedown', down);
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
    cmp.addEventListener('touchstart', down, { passive: false });
    cmp.addEventListener('touchmove', move, { passive: false });
    window.addEventListener('touchend', up);
  }
  handle.setAttribute('tabindex', '0');
  handle.setAttribute('role', 'slider');
  handle.setAttribute('aria-valuemin', '0');
  handle.setAttribute('aria-valuemax', '100');
  handle.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') { setPos(state.pos - 2); e.preventDefault(); }
    if (e.key === 'ArrowRight') { setPos(state.pos + 2); e.preventDefault(); }
  });
  [beforeI, afterI].forEach(function (img) {
    img.draggable = false;
    img.addEventListener('dragstart', function (e) { e.preventDefault(); });
  });

  render();
})();
</script>
</body>
</html>
